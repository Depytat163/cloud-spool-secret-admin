name: China Existing Set Binding
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-china-secret-administration
  cancel-in-progress: false
jobs:
  bind:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: secret-administration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned encryption dependency before credential release
        run: python3 -m pip install --disable-pip-version-check 'PyNaCl==1.6.2'
      - name: Offline security and crypto tests
        run: python3 -m unittest -v test_security test_crypto test_binding
      - name: Mint only China Secrets token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: '5399991'
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}
          owner: Depytat163
          repositories: China-Logistics-Simulation
          permission-secrets: write
          permission-metadata: read
      - name: Fixed existing-set binding with sanitized metadata receipt
        env:
          ADMIN_INSTALLATION_TOKEN: ${{ steps.app.outputs.token }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 china_binding.py
