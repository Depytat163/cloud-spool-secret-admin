name: Control Plane Security
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fixed policy, workflow and dummy request tests (no secrets)
        run: |
          python3 -m pip install --disable-pip-version-check 'PyNaCl==1.6.2'
          python3 -m unittest -v test_security test_crypto
